# ============================================================
# rdptun-client 配置示例
# 在本地开一个 TCP 端口，流量经伪装 RDP 会话转发到服务端 target。
# ============================================================

# 本地监听地址（应用连这里，如 ssh -p 1080）。
listen = "127.0.0.1:1080"

# 服务端地址（看起来就是一个普通 Windows RDP 主机）。
server = "203.0.113.10:3389"

# NLA 登录凭证（与服务端一致）。
username = "operator"
password = "ChangeMe#2026"

# 隧道通道名（与服务端一致）。
channel = "TUNNEL"

# 伪装的客户端计算机名（X.224 mstshash cookie + Client Name）。
client_name = "DESKTOP-RDPTUN"

# 服务端证书信任模式：
#   tofu — 首次连接记录 SPKI SHA-256，之后必须匹配（默认，像 mstsc 记住证书）
#   pin  — 必须匹配 pin_spki_sha256 指定的指纹
#   none — 不校验
trust = "tofu"
tofu_store = "cert-store/client-known-hosts"
# pin_spki_sha256 = "ab12cd34..."
